<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flubber (compute) — particle field in a 3D texture</title>
  <script type="module" src="./main.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 14px; color: #9aa3b5; z-index: 10;
      pointer-events: none; text-shadow: 0 1px 3px #000c;
    }
    #hud b { color: #ff9e5e; font-weight: 600; letter-spacing: .08em; }
    #hud .dim { color: #5a6478; }
    #fail {
      display: none; position: fixed; inset: 0; place-content: center;
      color: #9aa3b5; text-align: center; padding: 2rem;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <b>FLUBBER / COMPUTE</b><br>
    <span class="dim">128 particles simmed in compute → density splatted to a 64³
    texture → raymarched as one surface<br>
    console: rack.params() · rack.set("/flub/flow", 2.5, 2000) ·
    drag to orbit</span><br>
    <span id="fps" class="dim"></span>
  </div>
  <div id="fail">WebGPU unavailable — this demo needs a WebGPU-capable browser.</div>
</body>
</html>
