<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>lib3 — examples</title>
    <style>
      :root {
        --bg: #000;
        --line: #1c2230;
        --txt: #aeb6c6;
        --dim: #5a6478;
        --accent: #39e6c3;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: var(--bg);
        color: var(--txt);
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }

      /* three scenes, stacked fullscreen; a living voronoi deals every pixel
         to exactly one of them */
      .layer {
        position: fixed; inset: 0;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
        will-change: -webkit-mask-image, mask-image;
      }
      .layer iframe {
        /* overscanned + translated per frame: each portal's content glides
           toward its cell so the hero object stays exposed — but only at
           PARALLAX speed, so the mask reads as a window over a deeper world.
           Sizing/position set from JS (single source: PARALLAX). */
        position: absolute; border: 0; display: block;
        pointer-events: none; /* the index owns the pointer; click = travel */
        background: #000;
        will-change: transform;
      }

      #rings { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

      .portal-label {
        position: fixed; z-index: 6; transform: translate(-50%, -50%);
        color: var(--c, var(--accent)); text-decoration: none;
        text-align: center; letter-spacing: 0.1em; text-transform: uppercase;
        font-size: 11px; text-shadow: 0 1px 6px #000, 0 0 2px #000;
        opacity: 0.85; transition: opacity 0.2s;
      }
      .portal-label small {
        display: block; text-transform: none; letter-spacing: 0.02em;
        color: var(--txt); font-size: 10px; opacity: 0.7;
      }
      .portal-label:hover { opacity: 1; }

      #ui {
        position: fixed; z-index: 10; top: 18px; left: 18px;
        width: 260px; max-height: calc(100vh - 36px);
        display: flex; flex-direction: column;
        background: #05070bd0; border: 1px solid var(--line);
        border-radius: 10px; padding: 12px 14px;
        backdrop-filter: blur(6px);
      }
      #ui h1 {
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent); margin: 0 0 2px;
      }
      #ui .sub { color: var(--dim); font-size: 10px; margin: 0 0 10px; }
      #filter {
        width: 100%; background: #0c0f17d9; border: 1px solid var(--line);
        border-radius: 6px; color: var(--txt); font: inherit;
        padding: 6px 9px; outline: none; margin-bottom: 8px;
      }
      #filter:focus { border-color: var(--accent); }
      #list {
        overflow-y: auto; min-height: 0; padding-right: 4px;
        scrollbar-width: thin; scrollbar-color: var(--line) transparent;
      }
      #list a {
        display: block; color: var(--txt); text-decoration: none;
        padding: 3px 9px; border-radius: 4px;
        text-shadow: 0 1px 4px #000, 0 0 2px #000;
      }
      #list a:hover { background: #121826cc; color: var(--accent); }
      #list a.featured { color: var(--c, var(--accent)); }
      #list a.featured::before { content: "◉ "; }
      #count { color: var(--dim); font-size: 10px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <canvas id="rings"></canvas>

    <div id="ui">
      <h1>lib3 — examples</h1>
      <p class="sub">three cells share the screen · boundaries ride the noise · click one to step through</p>
      <input id="filter" type="search" placeholder="filter…" autocomplete="off" />
      <nav id="list"></nav>
      <div id="count"></div>
    </div>

    <script>
      // Injected by the examples-index vite plugin: [{ href, title }]
      const ENTRIES = __EXAMPLES_JSON__;

      // The three stories. Each gets a cell, a color, a slice of the field.
      const FEATURED = [
        {
          href: "examples/knot-morph-lab/",
          name: "knot morph lab",
          story: "a wireframe knot dancing four on the floor",
          color: "#39e6c3",
        },
        {
          href: "examples/flubber-compute/",
          name: "flubber compute",
          story: "128 particles → density field → glass",
          color: "#ff9e5e",
        },
        {
          href: "examples/anisotropic-fbm-volume/",
          name: "anisotropic fbm volume",
          story: "ghost smoke — ridged fBm, raymarched",
          color: "#a78bfa",
        },
      ];

      // ---- noise core (dynamics-notebook rung 4: value noise → fbm → curl) ----
      function hash3(ix, iy, iz) {
        let h = (ix * 374761393 + iy * 668265263 + iz * 1440662683) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smooth = (a, b, x) =>
        x <= a ? 0 : x >= b ? 1 : ((x = (x - a) / (b - a)), x * x * (3 - 2 * x));
      function vnoise(x, y, z) {
        const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
        const u = fade(x - X), v = fade(y - Y), w = fade(z - Z);
        return lerp(
          lerp(lerp(hash3(X, Y, Z), hash3(X + 1, Y, Z), u),
               lerp(hash3(X, Y + 1, Z), hash3(X + 1, Y + 1, Z), u), v),
          lerp(lerp(hash3(X, Y, Z + 1), hash3(X + 1, Y, Z + 1), u),
               lerp(hash3(X, Y + 1, Z + 1), hash3(X + 1, Y + 1, Z + 1), u), v),
          w);
      }
      function fbm(x, y, z, oct) {
        let amp = 0.5, f = 1, s = 0, norm = 0;
        for (let i = 0; i < oct; i++) {
          s += amp * vnoise(x * f, y * f, z * f);
          norm += amp; f *= 2; amp *= 0.5;
        }
        return s / norm;
      }
      // curl of ψ: rotate the gradient 90° — swirl with zero divergence,
      // so the cell seeds circulate forever and never park in a corner
      function curl(u, v, t, e, oct) {
        const gx = (fbm(u + e, v, t, oct) - fbm(u - e, v, t, oct)) / (2 * e);
        const gy = (fbm(u, v + e, t, oct) - fbm(u, v - e, t, oct)) / (2 * e);
        return [gy, -gx];
      }

      // ---- portals ---------------------------------------------------------------
      // A voronoi in motion, gone flubbery: every pixel belongs to whichever
      // roaming seed is nearest — but the distances are measured through a
      // domain-warping fbm (boundaries buckle into lobes), each seed carries a
      // breathing weight (cells swell and annex, shrink and cede), and it all
      // lives on the torus (cells pacman across the edges). The warped margin
      // between first- and second-nearest is the mask: solid in the cell body,
      // feathering to a dark seam at the frontier.
      const stage = document.getElementById("stage");
      const ringsCv = document.getElementById("rings");
      const ringsCtx = ringsCv.getContext("2d");
      const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let W = innerWidth, H = innerHeight;

      const portals = FEATURED.map((f, i) => {
        const layer = document.createElement("div");
        layer.className = "layer";
        const frame = document.createElement("iframe");
        frame.src = "/" + f.href;
        frame.title = f.name;
        layer.appendChild(frame);
        stage.appendChild(layer);

        const label = document.createElement("a");
        label.className = "portal-label";
        label.href = "/" + f.href;
        label.style.setProperty("--c", f.color);
        label.innerHTML = `${f.name}<small>${f.story}</small>`;
        document.body.appendChild(label);

        const mcv = document.createElement("canvas");
        const a = (i / FEATURED.length) * Math.PI * 2 - Math.PI / 2;
        return {
          ...f,
          layer, label, mcv,
          mctx: mcv.getContext("2d"),
          img: null, // ImageData, alloc'd on resize
          path: null, // cached boundary contour (Path2D)
          x: W / 2 + Math.cos(a) * W * 0.3,
          y: H / 2 + Math.sin(a) * H * 0.3,
          // each seed rides its own z-slice of ψ (a different story of the
          // same field) and carries a small pacman heading so it actually
          // crosses edges instead of circulating in place
          zOff: i * 7.31,
          hx: Math.cos(a + Math.PI / 3) * 24,
          hy: Math.sin(a + Math.PI / 3) * 24,
          w: 0, // breathing voronoi weight
          hover: 0,
        };
      });

      // ---- index list ------------------------------------------------------------
      const listEl = document.getElementById("list");
      const countEl = document.getElementById("count");
      const featuredHrefs = new Map(FEATURED.map((f) => [f.href, f]));
      function renderList(q = "") {
        listEl.innerHTML = "";
        let n = 0;
        for (const { href, title } of ENTRIES) {
          if (q && !title.toLowerCase().includes(q)) continue;
          const a = document.createElement("a");
          a.href = "/" + href;
          a.textContent = title;
          const f = featuredHrefs.get(href);
          if (f) { a.className = "featured"; a.style.setProperty("--c", f.color); }
          listEl.appendChild(a);
          n++;
        }
        countEl.textContent = `${n} / ${ENTRIES.length} examples`;
      }
      renderList();
      document.getElementById("filter").addEventListener("input", (e) => {
        renderList(e.target.value.trim().toLowerCase());
      });

      // ---- the field --------------------------------------------------------------
      const SC = 0.0016; // seed field: swirls a good fraction of the screen
      const STR = 110; // curl push on the seeds, px/s
      const EVOLVE = 0.035; // ψ drift through time
      const OCT = 3;
      const MSCALE = 8; // mask grid pitch, px — upscale smooths the frontier
      const WARP_A = 130; // domain-warp amplitude, px — how deep the lobes buckle
      const WARP_SC = 0.0028; // warp feature size (~350px lobes)
      const GAP = 4; // half-width of the dark seam between cells, px
      const FEATHER = 16; // margin over which a cell fades in from the seam
      const BREATH = 0.16; // weight swing as a fraction of the mean seed spacing
      const wrap = (v, m) => ((v % m) + m) % m;
      // shortest signed delta on the torus
      const tdelta = (a, b, m) => {
        let d = b - a;
        if (d > m / 2) d -= m;
        if (d < -m / 2) d += m;
        return d;
      };

      let gw = 0, gh = 0;
      let warpX = new Float32Array(0), warpY = new Float32Array(0);
      let warpFresh = false;

      function sizeAll() {
        W = innerWidth; H = innerHeight;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        ringsCv.width = W * dpr; ringsCv.height = H * dpr;
        ringsCv.style.width = W + "px"; ringsCv.style.height = H + "px";
        ringsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        gw = Math.ceil(W / MSCALE) + 1;
        gh = Math.ceil(H / MSCALE) + 1;
        warpX = new Float32Array(gw * gh);
        warpY = new Float32Array(gw * gh);
        warpFresh = false;
        for (const p of portals) {
          p.mcv.width = gw; p.mcv.height = gh;
          p.img = p.mctx.createImageData(gw, gh);
          const d = p.img.data;
          for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = 255; }
          p.path = null;
        }
      }
      sizeAll();
      addEventListener("resize", sizeAll);

      // the two warp channels are far-apart slices of the same fbm; refreshed
      // a stripe of rows per frame (rung 4's stagger) — the buckling drifts
      // slowly, so nobody notices the frontier is only 1/8th fresh per frame
      function refreshWarp(t, rowsMod, ofMod) {
        for (let j = rowsMod; j < gh; j += ofMod) {
          for (let i = 0; i < gw; i++) {
            const x = i * MSCALE * WARP_SC, y = j * MSCALE * WARP_SC;
            const idx = j * gw + i;
            warpX[idx] = (fbm(x, y, t * 0.12 + 11.3, 2) - 0.5) * 2 * WARP_A;
            warpY[idx] = (fbm(x + 51.7, y, t * 0.12 + 71.9, 2) - 0.5) * 2 * WARP_A;
          }
        }
      }

      // exact same assignment math, at one point — for hover and click
      function portalAt(x, y) {
        const wx = (fbm(x * WARP_SC, y * WARP_SC, tNow * 0.5 + 11.3, 2) - 0.5) * 2 * WARP_A;
        const wy = (fbm(x * WARP_SC + 51.7, y * WARP_SC, tNow * 0.5 + 71.9, 2) - 0.5) * 2 * WARP_A;
        const qx = wrap(x + wx, W), qy = wrap(y + wy, H);
        let best = null, bd = 1e9;
        for (const p of portals) {
          const dx = tdelta(qx, p.x, W), dy = tdelta(qy, p.y, H);
          const d = Math.hypot(dx, dy) - p.w;
          if (d < bd) { bd = d; best = p; }
        }
        return best;
      }

      let mx = -1e4, my = -1e4;
      addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; });
      addEventListener("click", (e) => {
        if (e.target.closest("#ui") || e.target.closest(".portal-label")) return;
        const p = portalAt(e.clientX, e.clientY);
        if (p) location.href = "/" + p.href;
      });

      // ---- marching squares over the signed margin: the frontier as a line --------
      // per-case segments between edge crossings (0 top, 1 right, 2 bottom, 3 left)
      const MS = [
        [], [[3, 0]], [[0, 1]], [[3, 1]],
        [[1, 2]], [[3, 0], [1, 2]], [[0, 2]], [[3, 2]],
        [[2, 3]], [[0, 2]], [[0, 1], [2, 3]], [[1, 2]],
        [[3, 1]], [[0, 1]], [[3, 0]], [],
      ];
      let marginF = new Float32Array(0); // realloc'd alongside the grid
      function contourPath(iso) {
        const path = new Path2D();
        for (let j = 0; j < gh - 1; j++) {
          for (let i = 0; i < gw - 1; i++) {
            const a = marginF[j * gw + i], b = marginF[j * gw + i + 1];
            const c = marginF[(j + 1) * gw + i + 1], d = marginF[(j + 1) * gw + i];
            const idx = (a > iso ? 1 : 0) | (b > iso ? 2 : 0) |
                        (c > iso ? 4 : 0) | (d > iso ? 8 : 0);
            if (idx === 0 || idx === 15) continue;
            const x0 = i * MSCALE, y0 = j * MSCALE;
            const pt = (edge) => {
              switch (edge) {
                case 0: return [x0 + MSCALE * ((iso - a) / (b - a)), y0];
                case 1: return [x0 + MSCALE, y0 + MSCALE * ((iso - b) / (c - b))];
                case 2: return [x0 + MSCALE * ((iso - d) / (c - d)), y0 + MSCALE];
                case 3: return [x0, y0 + MSCALE * ((iso - a) / (d - a))];
              }
            };
            for (const [e0, e1] of MS[idx]) {
              const [ax, ay] = pt(e0), [bx, by] = pt(e1);
              path.moveTo(ax, ay);
              path.lineTo(bx, by);
            }
          }
        }
        return path;
      }

      let t = 40.0, tNow = t, last = performance.now(), frameNo = 0;
      function frameLoop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        frameNo++;
        if (!calm) t += EVOLVE * dt * 60;
        tNow = t;

        const meanSpacing = Math.sqrt((W * H) / portals.length);
        const e = 2 * SC;

        if (marginF.length < gw * gh) marginF = new Float32Array(gw * gh);
        if (!warpFresh) { refreshWarp(t, 0, 1); warpFresh = true; }
        else if (!calm) refreshWarp(t, frameNo % 8, 8);

        // seeds roam on the curl field; weights breathe territory in and out
        for (let i = 0; i < portals.length; i++) {
          const p = portals[i];
          if (!calm) {
            const [cx, cy] = curl(p.x * SC, p.y * SC, t + p.zOff, e, OCT);
            p.x += (cx * STR + p.hx) * dt;
            p.y += (cy * STR + p.hy) * dt;
            p.x = wrap(p.x, W); p.y = wrap(p.y, H);
          }
          p.w = meanSpacing * BREATH * (fbm(t * 0.35 + i * 13.7, 7.1, 3.3, 2) * 2 - 1);
        }

        // gentle repulsion so no cell gets pinched out of existence
        for (let i = 0; i < portals.length; i++) {
          for (let j = i + 1; j < portals.length; j++) {
            const a = portals[i], b = portals[j];
            const dx = tdelta(a.x, b.x, W), dy = tdelta(a.y, b.y, H);
            const d = Math.hypot(dx, dy) || 1;
            const min = meanSpacing * 0.6;
            if (d < min) {
              const push = ((min - d) / min) * 60 * dt;
              a.x = wrap(a.x - (dx / d) * push, W);
              a.y = wrap(a.y - (dy / d) * push, H);
              b.x = wrap(b.x + (dx / d) * push, W);
              b.y = wrap(b.y + (dy / d) * push, H);
            }
          }
        }

        // one pass deals the grid: alpha + frontier for the round-robin cell
        // (masks refresh one per frame; the warp drifts slowly enough that a
        // 3-frame-stale neighbour is invisible)
        const rr = frameNo < 4 ? (frameNo - 1) % portals.length : frameNo % portals.length;
        const P = portals[rr];
        const data = P.img.data;
        for (let j = 0; j < gh; j++) {
          for (let i = 0; i < gw; i++) {
            const idx = j * gw + i;
            const qx = wrap(i * MSCALE + warpX[idx], W);
            const qy = wrap(j * MSCALE + warpY[idx], H);
            let dMine = 0, dOther = 1e9;
            for (const p of portals) {
              const dx = tdelta(qx, p.x, W), dy = tdelta(qy, p.y, H);
              const d = Math.hypot(dx, dy) - p.w;
              if (p === P) dMine = d;
              else if (d < dOther) dOther = d;
            }
            const m = dOther - dMine; // signed: positive inside our cell
            marginF[idx] = m;
            data[idx * 4 + 3] = Math.round(smooth(GAP, GAP + FEATHER, m) * 255);
          }
        }
        P.mctx.putImageData(P.img, 0, 0);
        const url = `url(${P.mcv.toDataURL()})`;
        P.layer.style.webkitMaskImage = url;
        P.layer.style.maskImage = url;
        P.path = contourPath(GAP + FEATHER * 0.5);

        // draw: cached frontiers for everyone, hover glow, labels
        ringsCtx.clearRect(0, 0, W, H);
        const hoverP = portalAt(mx, my);
        document.body.style.cursor = hoverP ? "pointer" : "";
        for (const p of portals) {
          p.hover += ((hoverP === p ? 1 : 0) - p.hover) * Math.min(1, dt * 8);
          if (p.path) {
            ringsCtx.strokeStyle = p.color;
            ringsCtx.globalAlpha = 0.35 + p.hover * 0.4;
            ringsCtx.lineWidth = 1;
            ringsCtx.stroke(p.path);
          }
          p.label.style.left = Math.max(100, Math.min(W - 100, p.x)) + "px";
          p.label.style.top = Math.max(40, Math.min(H - 40, p.y)) + "px";
        }
        ringsCtx.globalAlpha = 1;

        requestAnimationFrame(frameLoop);
      }
      requestAnimationFrame(frameLoop);
    </script>
  </body>
</html>
