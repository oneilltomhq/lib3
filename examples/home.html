<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>lib3 — examples</title>
    <style>
      :root {
        --bg: #000;
        --line: #1c2230;
        --txt: #aeb6c6;
        --dim: #5a6478;
        --accent: #39e6c3;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: var(--bg);
        color: var(--txt);
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }

      /* three scenes, stacked fullscreen, each revealed through roaming ink */
      .layer {
        position: fixed; inset: 0;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
        will-change: -webkit-mask-image, mask-image;
      }
      .layer iframe {
        width: 100%; height: 100%; border: 0; display: block;
        pointer-events: none; /* the index owns the pointer; click = travel */
        background: #000;
      }

      #rings { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

      .portal-label {
        position: fixed; z-index: 6; transform: translate(-50%, -50%);
        color: var(--c, var(--accent)); text-decoration: none;
        text-align: center; letter-spacing: 0.1em; text-transform: uppercase;
        font-size: 11px; text-shadow: 0 1px 6px #000, 0 0 2px #000;
        opacity: 0.85; transition: opacity 0.2s;
      }
      .portal-label small {
        display: block; text-transform: none; letter-spacing: 0.02em;
        color: var(--txt); font-size: 10px; opacity: 0.7;
      }
      .portal-label:hover { opacity: 1; }

      #ui {
        position: fixed; z-index: 10; top: 18px; left: 18px;
        width: 250px; max-height: calc(100vh - 36px);
        display: flex; flex-direction: column;
      }
      #ui h1 {
        font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent); margin: 0 0 2px;
      }
      #ui .sub { color: var(--dim); font-size: 10px; margin: 0 0 10px; }
      #filter {
        width: 100%; background: #0c0f17d9; border: 1px solid var(--line);
        border-radius: 6px; color: var(--txt); font: inherit;
        padding: 6px 9px; outline: none; margin-bottom: 8px;
      }
      #filter:focus { border-color: var(--accent); }
      #list {
        overflow-y: auto; min-height: 0; padding-right: 4px;
        scrollbar-width: thin; scrollbar-color: var(--line) transparent;
      }
      #list a {
        display: block; color: var(--txt); text-decoration: none;
        padding: 3px 9px; border-radius: 4px;
        text-shadow: 0 1px 4px #000, 0 0 2px #000;
      }
      #list a:hover { background: #121826cc; color: var(--accent); }
      #list a.featured { color: var(--c, var(--accent)); }
      #list a.featured::before { content: "◉ "; }
      #count { color: var(--dim); font-size: 10px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <canvas id="rings"></canvas>

    <div id="ui">
      <h1>lib3 — examples</h1>
      <p class="sub">three portals roam on curl noise · click one to step through</p>
      <input id="filter" type="search" placeholder="filter…" autocomplete="off" />
      <nav id="list"></nav>
      <div id="count"></div>
    </div>

    <script>
      // Injected by the examples-index vite plugin: [{ href, title }]
      const ENTRIES = __EXAMPLES_JSON__;

      // The three stories. Each gets a portal, a color, a slice of the field.
      const FEATURED = [
        {
          href: "examples/knot-morph-lab/",
          name: "knot morph lab",
          story: "a wireframe knot dancing four on the floor",
          color: "#39e6c3",
        },
        {
          href: "examples/flubber-compute/",
          name: "flubber compute",
          story: "128 particles → density field → glass",
          color: "#ff9e5e",
        },
        {
          href: "examples/anisotropic-fbm-volume/",
          name: "anisotropic fbm volume",
          story: "ghost smoke — ridged fBm, raymarched",
          color: "#a78bfa",
        },
      ];

      // ---- noise core (dynamics-notebook rung 4: value noise → fbm → curl) ----
      function hash3(ix, iy, iz) {
        let h = (ix * 374761393 + iy * 668265263 + iz * 1440662683) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
      const lerp = (a, b, t) => a + (b - a) * t;
      function vnoise(x, y, z) {
        const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
        const u = fade(x - X), v = fade(y - Y), w = fade(z - Z);
        return lerp(
          lerp(lerp(hash3(X, Y, Z), hash3(X + 1, Y, Z), u),
               lerp(hash3(X, Y + 1, Z), hash3(X + 1, Y + 1, Z), u), v),
          lerp(lerp(hash3(X, Y, Z + 1), hash3(X + 1, Y, Z + 1), u),
               lerp(hash3(X, Y + 1, Z + 1), hash3(X + 1, Y + 1, Z + 1), u), v),
          w);
      }
      function fbm(x, y, z, oct) {
        let amp = 0.5, f = 1, s = 0, norm = 0;
        for (let i = 0; i < oct; i++) {
          s += amp * vnoise(x * f, y * f, z * f);
          norm += amp; f *= 2; amp *= 0.5;
        }
        return s / norm;
      }
      // curl of ψ: rotate the gradient 90° — swirl with zero divergence,
      // so the ink circulates forever and never piles up
      function curl(u, v, t, e, oct) {
        const gx = (fbm(u + e, v, t, oct) - fbm(u - e, v, t, oct)) / (2 * e);
        const gy = (fbm(u, v + e, t, oct) - fbm(u, v - e, t, oct)) / (2 * e);
        return [gy, -gx];
      }
      function gauss() {
        let u = 0, v = 0;
        while (!u) u = Math.random();
        while (!v) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(Math.PI * 2 * v);
      }

      // ---- portals ---------------------------------------------------------------
      // Rung 4's smoke, weaponized as a mask: each portal is a swarm of
      // particles riding the curl field around a roaming centre, drawn into a
      // small offscreen canvas that fades instead of clearing — motion leaves
      // ink, and the ink IS the reveal (mask-image, upscaled so the low-res
      // grain feathers into softness).
      const P = 1400; // particles per portal
      const MSCALE = 3.2; // mask canvas downscale — upscaling = free feather
      const stage = document.getElementById("stage");
      const ringsCv = document.getElementById("rings");
      const ringsCtx = ringsCv.getContext("2d");
      const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let W = innerWidth, H = innerHeight;

      const portals = FEATURED.map((f, i) => {
        const layer = document.createElement("div");
        layer.className = "layer";
        const frame = document.createElement("iframe");
        frame.src = "/" + f.href;
        frame.title = f.name;
        layer.appendChild(frame);
        stage.appendChild(layer);

        const label = document.createElement("a");
        label.className = "portal-label";
        label.href = "/" + f.href;
        label.style.setProperty("--c", f.color);
        label.innerHTML = `${f.name}<small>${f.story}</small>`;
        document.body.appendChild(label);

        const mcv = document.createElement("canvas");
        const a = (i / FEATURED.length) * Math.PI * 2 - Math.PI / 2;
        return {
          ...f,
          layer, label, mcv,
          mctx: mcv.getContext("2d", { willReadFrequently: true }),
          x: W / 2 + Math.cos(a) * W * 0.28,
          y: H / 2 + Math.sin(a) * H * 0.28,
          // each portal rides its own z-slice of ψ (a different story of the
          // same field) and carries a small pacman heading so it actually
          // crosses edges instead of circulating in place
          zOff: i * 7.31,
          hx: Math.cos(a + Math.PI / 3) * 24,
          hy: Math.sin(a + Math.PI / 3) * 24,
          parts: null, // seeded on first frame, once sizes are known
          hover: 0,
        };
      });

      // ---- index list ------------------------------------------------------------
      const listEl = document.getElementById("list");
      const countEl = document.getElementById("count");
      const featuredHrefs = new Map(FEATURED.map((f) => [f.href, f]));
      function renderList(q = "") {
        listEl.innerHTML = "";
        let n = 0;
        for (const { href, title } of ENTRIES) {
          if (q && !title.toLowerCase().includes(q)) continue;
          const a = document.createElement("a");
          a.href = "/" + href;
          a.textContent = title;
          const f = featuredHrefs.get(href);
          if (f) { a.className = "featured"; a.style.setProperty("--c", f.color); }
          listEl.appendChild(a);
          n++;
        }
        countEl.textContent = `${n} / ${ENTRIES.length} examples`;
      }
      renderList();
      document.getElementById("filter").addEventListener("input", (e) => {
        renderList(e.target.value.trim().toLowerCase());
      });

      // ---- the roam ---------------------------------------------------------------
      const SC = 0.0016; // portal-centre field: swirls a good fraction of the screen
      const STR = 110; // curl push on the portal centre, px/s
      const SC2 = 0.004; // ink field: the swirls the filaments actually trace
      const STR2 = 190; // curl push on the ink, px/s (rung 4's /smoke/strength)
      // no spring: a centre-pull is divergent — it fights the incompressible
      // field and smears the filament structure. Containment comes from
      // LIFETIME instead: particles are born at the roaming core, ride the
      // streamlines outward, and die — an emitter, not a cage.
      const FADE_A = 0.024; // trail decay per frame — the ink's memory
      const EVOLVE = 0.035; // ψ drift through time
      const OCT = 3;
      const wrap = (v, m) => ((v % m) + m) % m;
      // shortest signed delta on the torus
      const tdelta = (a, b, m) => {
        let d = b - a;
        if (d > m / 2) d -= m;
        if (d < -m / 2) d += m;
        return d;
      };

      function sizeCanvases() {
        W = innerWidth; H = innerHeight;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        ringsCv.width = W * dpr; ringsCv.height = H * dpr;
        ringsCv.style.width = W + "px"; ringsCv.style.height = H + "px";
        ringsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (const p of portals) {
          p.mcv.width = Math.ceil(W / MSCALE);
          p.mcv.height = Math.ceil(H / MSCALE);
        }
      }
      sizeCanvases();
      addEventListener("resize", sizeCanvases);

      function spawn(q, p, baseR) {
        q.x = wrap(p.x + gauss() * baseR * 0.18, W);
        q.y = wrap(p.y + gauss() * baseR * 0.18, H);
        q.px = q.x; q.py = q.y;
        q.age = 0;
        q.life = 2 + Math.random() * 3;
        q.cx = 0; q.cy = 0;
      }
      function seed(p, baseR) {
        p.parts = [];
        for (let k = 0; k < P; k++) {
          const q = {};
          spawn(q, p, baseR);
          q.age = Math.random() * q.life; // stagger deaths from the start
          p.parts.push(q);
        }
      }

      let mx = -1e4, my = -1e4;
      addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; });

      // the ink is the truth: a point is "in" a portal iff its mask has ink there
      function portalAt(x, y) {
        for (let i = portals.length - 1; i >= 0; i--) {
          const p = portals[i];
          const d = p.mctx.getImageData(
            Math.min(p.mcv.width - 1, x / MSCALE) | 0,
            Math.min(p.mcv.height - 1, y / MSCALE) | 0, 1, 1).data;
          if (d[3] > 90) return p;
        }
        return null;
      }
      addEventListener("click", (e) => {
        if (e.target.closest("#ui") || e.target.closest(".portal-label")) return;
        const p = portalAt(e.clientX, e.clientY);
        if (p) location.href = "/" + p.href;
      });

      let t = 40.0, last = performance.now(), frameNo = 0;
      function frameLoop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        frameNo++;
        if (!calm) t += EVOLVE * dt * 60;

        // sized from AREA: the three swarms together own about half the screen
        const baseR = Math.sqrt((W * H * 0.34) / Math.PI);
        const CAP = baseR * 1.05; // safety net past the lifetime containment
        const e = 2 * SC, e2 = 2 * SC2;
        const dot = Math.max(1.6, baseR / 150); // streak width, mask-canvas px

        ringsCtx.clearRect(0, 0, W, H);
        const hoverP = portalAt(mx, my);
        document.body.style.cursor = hoverP ? "pointer" : "";

        let pi = -1;
        for (const p of portals) {
          pi++;
          if (!p.parts) {
            seed(p, baseR);
            if (calm) {
              // reduced motion: one static soft pool instead of living ink
              const g = p.mctx.createRadialGradient(
                p.x / MSCALE, p.y / MSCALE, 0,
                p.x / MSCALE, p.y / MSCALE, baseR * 0.75 / MSCALE);
              g.addColorStop(0, "rgba(255,255,255,1)");
              g.addColorStop(1, "rgba(255,255,255,0)");
              p.mctx.fillStyle = g;
              p.mctx.fillRect(0, 0, p.mcv.width, p.mcv.height);
            }
          }
          if (!calm) {
            const [cx, cy] = curl(p.x * SC, p.y * SC, t + p.zOff, e, OCT);
            p.x += (cx * STR + p.hx) * dt;
            p.y += (cy * STR + p.hy) * dt;
            p.x = wrap(p.x, W); p.y = wrap(p.y, H);
          }
          p.hover += ((hoverP === p ? 1 : 0) - p.hover) * Math.min(1, dt * 8);

          const m = p.mctx;
          if (!calm) {
            // fade instead of clear → motion leaves ink (rung 4's whole trick)
            m.globalCompositeOperation = "destination-out";
            m.fillStyle = `rgba(0,0,0,${FADE_A})`;
            m.fillRect(0, 0, p.mcv.width, p.mcv.height);
            m.globalCompositeOperation = "source-over";
          }
          m.strokeStyle = `rgba(255,255,255,${0.8 + 0.2 * p.hover})`;
          m.lineWidth = dot;
          m.lineCap = "round";
          ringsCtx.strokeStyle = p.color;
          ringsCtx.globalAlpha = 0.16;
          ringsCtx.lineWidth = 1.2;

          // each particle draws the streak it just flew — segments chain
          // frame over frame into continuous filaments along the streamlines
          m.beginPath();
          ringsCtx.beginPath();
          const zi = t * 1.3 + p.zOff + 31.7;
          for (let k = 0; k < P; k++) {
            const q = p.parts[k];
            if (!calm) {
              // stagger: refresh half the field samples each frame (rung 4)
              if ((k & 1) === (frameNo & 1)) {
                const [gx, gy] = curl(q.x * SC2, q.y * SC2, zi, e2, OCT);
                q.cx = gx; q.cy = gy;
              }
              q.px = q.x; q.py = q.y;
              q.x = wrap(q.x + q.cx * STR2 * dt, W);
              q.y = wrap(q.y + q.cy * STR2 * dt, H);
              q.age += dt;
              const px = tdelta(q.x, p.x, W), py = tdelta(q.y, p.y, H);
              if (q.age > q.life || px * px + py * py > CAP * CAP) {
                spawn(q, p, baseR);
              }
            }
            // skip the stitch frame when a particle wraps or respawns
            if (Math.abs(q.x - q.px) < W / 2 && Math.abs(q.y - q.py) < H / 2) {
              m.moveTo(q.px / MSCALE, q.py / MSCALE);
              m.lineTo(q.x / MSCALE, q.y / MSCALE);
              // same ink, tinted, on the overlay — the portal stays legible
              // even where the scene behind it is black
              ringsCtx.moveTo(q.px, q.py);
              ringsCtx.lineTo(q.x, q.y);
            }
          }
          m.stroke();
          ringsCtx.stroke();
          ringsCtx.globalAlpha = 1;

          // the ink becomes the mask. Encoding is the dear part (~4ms), so
          // masks refresh round-robin — one portal per frame; the trails'
          // own smear hides the 50ms latency completely
          if (frameNo % portals.length === pi || frameNo < 4) {
            const url = `url(${p.mcv.toDataURL()})`;
            p.layer.style.webkitMaskImage = url;
            p.layer.style.maskImage = url;
          }

          // label rides the portal centre, clamped just inside the frame
          p.label.style.left = Math.max(90, Math.min(W - 90, p.x)) + "px";
          p.label.style.top = Math.max(40, Math.min(H - 40, p.y)) + "px";
        }

        // gentle repulsion so the three stories stay distinct
        for (let i = 0; i < portals.length; i++) {
          for (let j = i + 1; j < portals.length; j++) {
            const a = portals[i], b = portals[j];
            const dx = tdelta(a.x, b.x, W), dy = tdelta(a.y, b.y, H);
            const d = Math.hypot(dx, dy) || 1;
            const min = baseR * 1.5;
            if (d < min) {
              const push = ((min - d) / min) * 60 * dt;
              a.x = wrap(a.x - (dx / d) * push, W);
              a.y = wrap(a.y - (dy / d) * push, H);
              b.x = wrap(b.x + (dx / d) * push, W);
              b.y = wrap(b.y + (dy / d) * push, H);
            }
          }
        }

        requestAnimationFrame(frameLoop);
      }
      requestAnimationFrame(frameLoop);
    </script>
  </body>
</html>
