<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra × Metaballs — liquid glass over a video synth</title>
  <script type="module" src="./main.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 14px; color: #9aa3b5; z-index: 10;
      pointer-events: none; text-shadow: 0 1px 3px #000c;
    }
    #hud b { color: #39e6c3; font-weight: 600; letter-spacing: .08em; }
    #hud .dim { color: #5a6478; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <b>HYDRA × METABALLS</b><br>
    <span class="dim">liquid glass refracting a live video synth · 120bpm room ·
    drag to orbit<br>
    console: rack.params() · rack.set("/synth/flow", 24, 2000) ·
    rack.snap("nice")</span>
  </div>
</body>
</html>
