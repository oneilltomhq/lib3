<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightning Lab — lib3</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #canvas { width: 100%; height: 100%; display: block; }
      #hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: #bbb;
        font: 12px/1.4 system-ui, sans-serif;
        pointer-events: none;
      }
      #hint kbd {
        background: #1f2937;
        color: #e5e7eb;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hint">
      Click to trigger a lightning strike. Use the inspector panel to adjust parameters.
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
