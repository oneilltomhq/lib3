<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaballs Explainer</title>
    <script type="module" src="./main.js"></script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: #0a0d10;
        color: #f5f7fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: fixed;
        left: 16px;
        top: 16px;
        width: min(440px, calc(100vw - 32px));
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 8px;
        background: rgb(8 10 14 / 0.78);
        box-shadow: 0 18px 60px rgb(0 0 0 / 0.32);
        backdrop-filter: blur(18px);
        padding: 14px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.1;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      button {
        min-height: 32px;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.07);
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        border-color: rgb(122 240 255 / 0.62);
        background: rgb(122 240 255 / 0.16);
      }

      .copy {
        margin-top: 12px;
        color: rgb(245 247 251 / 0.74);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 720px) {
        .panel {
          top: auto;
          bottom: 12px;
          left: 12px;
          width: calc(100vw - 24px);
          padding: 12px;
        }

        .tabs {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        button {
          font-size: 11px;
          padding-inline: 4px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <section class="panel" aria-label="Metaballs explainer">
      <h1>Metaballs Explainer</h1>
      <div class="tabs" id="tabs"></div>
      <div class="copy" id="copy"></div>
    </section>
  </body>
</html>
