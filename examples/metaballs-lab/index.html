<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaballs Lab</title>
    <script type="module" src="./main.js"></script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: #08090b;
        color: #f5f7fb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: fixed;
        left: 16px;
        top: 16px;
        width: min(380px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 8px;
        background: rgb(7 9 13 / 0.76);
        box-shadow: 0 18px 60px rgb(0 0 0 / 0.28);
        backdrop-filter: blur(18px);
        padding: 14px;
      }

      .title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.1;
        font-weight: 650;
      }

      .readout {
        color: rgb(245 247 251 / 0.68);
        font-size: 12px;
        white-space: nowrap;
      }

      .fps {
        position: fixed;
        right: 16px;
        top: 16px;
        min-width: 72px;
        border: 1px solid rgb(255 255 255 / 0.18);
        border-radius: 6px;
        background: rgb(7 9 13 / 0.82);
        box-shadow: 0 12px 36px rgb(0 0 0 / 0.3);
        color: rgb(255 255 255 / 0.94);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: 1;
        padding: 8px 10px;
        text-align: right;
        backdrop-filter: blur(14px);
      }

      .modes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 12px;
      }

      button {
        min-height: 32px;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.07);
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        border-color: rgb(122 240 255 / 0.62);
        background: rgb(122 240 255 / 0.16);
      }

      .toggles,
      .sliders {
        display: grid;
        gap: 8px;
      }

      .control-groups {
        display: grid;
        gap: 12px;
      }

      .group {
        display: grid;
        gap: 8px;
        border-top: 1px solid rgb(255 255 255 / 0.1);
        padding-top: 10px;
      }

      .group-title {
        margin: 0;
        color: rgb(245 247 251 / 0.92);
        font-size: 11px;
        line-height: 1;
        font-weight: 700;
        text-transform: uppercase;
      }

      .stack {
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.06);
        color: rgb(245 247 251 / 0.78);
        font-size: 12px;
        line-height: 1.35;
        margin-bottom: 12px;
        padding: 8px 10px;
      }

      label {
        display: grid;
        gap: 5px;
        color: rgb(245 247 251 / 0.76);
        font-size: 12px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      select {
        min-height: 30px;
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 6px;
        background: rgb(16 20 27 / 0.96);
        color: inherit;
        font: inherit;
        font-size: 12px;
        padding-inline: 8px;
      }

      input[type="range"] {
        width: 100%;
      }

      .explain {
        margin-top: 12px;
        border-top: 1px solid rgb(255 255 255 / 0.12);
        padding-top: 10px;
        color: rgb(245 247 251 / 0.72);
        font-size: 12px;
        line-height: 1.45;
      }

      @media (max-width: 720px) {
        .panel {
          top: auto;
          bottom: 12px;
          left: 12px;
          width: calc(100vw - 24px);
          max-height: calc(100vh - 24px);
          padding: 12px;
        }

        .modes {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        button {
          font-size: 11px;
          padding-inline: 4px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="fps" id="fpsMeter">-- fps</div>
    <section class="panel" aria-label="Metaballs controls">
      <div class="title">
        <h1>Metaballs Lab</h1>
        <div class="readout" id="readout">18 animated SDF sources</div>
      </div>
      <div class="modes" id="modeButtons"></div>
      <div class="stack" id="stackReadout">SDF sources -> raymarched shape</div>
      <div class="control-groups">
        <div class="group">
          <p class="group-title">SDF</p>
          <div class="sliders">
            <label>
              smoothing <span id="smoothingValue">0.70</span>
              <input id="smoothingSlider" type="range" min="0.02" max="0.7" step="0.01" value="0.7" />
            </label>
          </div>
        </div>
        <div class="group">
          <p class="group-title">Raymarch</p>
          <div class="sliders">
            <label>
              steps <span id="stepsValue">120</span>
              <input id="stepsSlider" type="range" min="8" max="120" step="1" value="120" />
            </label>
          </div>
        </div>
        <div class="group">
          <p class="group-title">Shading</p>
          <div class="sliders">
            <label>
              refraction <span id="refractionValue">0.00</span>
              <input id="refractionSlider" type="range" min="0" max="0.5" step="0.01" value="0" />
            </label>
          </div>
        </div>
        <div class="group">
          <p class="group-title">Dance</p>
          <div class="sliders">
            <label>
              speed <span id="danceSpeedValue">1.00</span>
              <input id="danceSpeedSlider" type="range" min="0" max="2" step="0.01" value="1" />
            </label>
            <label>
              violence <span id="danceViolenceValue">1.00</span>
              <input id="danceViolenceSlider" type="range" min="0" max="2" step="0.01" value="1" />
            </label>
            <label>
              pulse <span id="dancePulseValue">1.00</span>
              <input id="dancePulseSlider" type="range" min="0" max="2" step="0.01" value="1" />
            </label>
          </div>
        </div>
        <div class="group">
          <p class="group-title">Scene Inputs</p>
          <div class="toggles">
            <label class="toggle">
              <input id="sourcesToggle" type="checkbox" />
              source spheres
            </label>
            <label>
              background pattern
              <select id="backgroundPattern">
                <option value="plain">plain</option>
                <option value="grid" selected>grid</option>
                <option value="stripes">stripes</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div class="explain" id="explain"></div>
    </section>
  </body>
</html>
