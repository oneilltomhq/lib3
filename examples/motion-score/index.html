<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Motion Score — lib3</title>
    <style>
      :root { --bg:#04050a; --txt:#aeb6c6; --dim:#5a6478; --accent:#39e6c3; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
        font:12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
      canvas { display:block; width:100vw; height:100vh; }
      #hud { position:fixed; left:12px; top:10px; pointer-events:none; }
      #hud h1 { font-size:11px; letter-spacing:.12em; text-transform:uppercase;
        color:var(--accent); margin:0 0 2px; }
      #hud .sub { color:var(--dim); font-size:10px; margin:0; max-width:380px; }
      #stage { position:fixed; right:12px; top:10px; color:var(--dim);
        font-size:10px; letter-spacing:.1em; text-transform:uppercase; text-align:right; }
      #stage b { color:var(--accent); font-weight:normal; }
      #fail { display:none; position:fixed; inset:0; place-items:center; }
      #panel { position:fixed; right:12px; bottom:12px; width:230px;
        background:rgba(6,8,16,.82); border:1px solid #1c2436; border-radius:6px;
        padding:10px 12px; font-size:10px; color:var(--txt); }
      #panel h2 { font-size:10px; letter-spacing:.12em; text-transform:uppercase;
        color:var(--accent); margin:8px 0 4px; }
      #panel h2:first-child { margin-top:0; }
      #panel .tech { display:flex; flex-wrap:wrap; gap:4px; }
      #panel .tech button { background:#0c1220; border:1px solid #232d44;
        color:var(--dim); font:inherit; padding:2px 7px; border-radius:3px; cursor:pointer; }
      #panel .tech button.on { color:var(--accent); border-color:var(--accent); }
      #panel .row { display:grid; grid-template-columns:74px 1fr 34px;
        gap:6px; align-items:center; margin:3px 0; }
      #panel .row span:last-child { text-align:right; color:var(--dim); }
      #panel input[type=range] { width:100%; accent-color:var(--accent); height:10px; }
      #panel .hint { color:var(--dim); margin-top:8px; }
    </style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <h1>Motion Score</h1>
      <p class="sub">two attractor wells on a choreographed phrase ·
        orbit → gear-shift build → late brake into tight arc → crash release ·
        drag to orbit</p>
    </div>
    <div id="stage"><b id="stage-name">orbit</b><br /><span id="stage-meta"></span></div>
    <div id="panel"></div>
    <div id="fail">WebGPU unavailable</div>
  </body>
</html>
