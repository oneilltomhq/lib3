<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimbus — lib3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #container { width: 100%; height: 100%; }
    #hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: #667; font: 12px/1.4 system-ui; letter-spacing: 0.06em;
      user-select: none; pointer-events: none;
    }
    #error { color: #f44; font-family: monospace; padding: 2em; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="hint">click / space — strike · v — vista</div>
  <div id="error"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
