<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splat Metaballs Proof</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #08090b;
        color: #e8edf2;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .panel {
        position: fixed;
        left: 16px;
        top: 16px;
        width: min(360px, calc(100vw - 32px));
        padding: 14px;
        background: rgba(8, 10, 13, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 5px;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #aeb8c5;
        font-size: 12px;
        line-height: 1.4;
      }

      .control {
        display: grid;
        gap: 5px;
        margin-top: 12px;
      }

      label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #aeb8c5;
        font-size: 12px;
        font-weight: 650;
      }

      select,
      button {
        min-height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: #121820;
        color: #e8edf2;
        padding: 0 8px;
      }

      button[aria-pressed="true"] {
        background: #294b67;
        border-color: #6ca9d1;
      }

      .readout {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <section class="panel">
      <h1>Splat Metaballs Proof</h1>
      <p id="status">Booting WebGPU splat proof.</p>
      <div class="control">
        <label for="sourceCount">
          source count
          <span id="sourceCountValue">64</span>
        </label>
        <select id="sourceCount">
          <option value="64" selected>64</option>
          <option value="128">128</option>
          <option value="256">256</option>
          <option value="512">512</option>
          <option value="1024">1024</option>
        </select>
      </div>
      <div class="control">
        <button id="motion" type="button" aria-pressed="false">GPU motion</button>
      </div>
      <p class="readout" id="readout">Additive soft splats. High scale, approximate metaball look, no raymarch.</p>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
